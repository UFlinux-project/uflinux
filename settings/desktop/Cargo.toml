[package]
name = "uflinux-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
settings-core.workspace = true
uflinux-settings = { path = "../ui" }
serde.workspace = true
serde_json.workspace = true
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
gio-unix.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
gdk-pixbuf = "0.22"
async-channel.workspace = true
futures-util = "=0.3.34"
libc.workspace = true
wayland-client = "=0.31.14"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
