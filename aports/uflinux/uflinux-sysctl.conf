# UFLinux kernel tuning. Applied by OpenRC's sysctl service, which reads this
# vendor drop-in before /etc/sysctl.d/*.conf and /etc/sysctl.conf, so a machine
# can override a single key there (or mask this file with an empty
# /etc/sysctl.d/60-uflinux.conf) without editing the package.

# Memory management: keep a larger reserve of free pages so allocation
# bursts on a desktop session don't stall in direct reclaim, and keep the
# dentry/inode cache from shrinking too aggressively.
vm.watermark_scale_factor = 50
vm.watermark_boost_factor = 15000
vm.vfs_cache_pressure = 75
vm.compaction_proactiveness = 20

# Low-latency HDD writeback. Byte thresholds instead of the percentage
# defaults: on a large-RAM machine dirty_background_ratio/dirty_ratio would
# let hundreds of megabytes build up, and one flush then blocks the desktop.
# These are mutually exclusive with the ratio knobs, so writing the bytes
# pair zeroes them.
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864
vm.dirty_writeback_centisecs = 500
vm.dirty_expire_centisecs = 1500

# Network responsiveness. fq_codel keeps interactive traffic flowing behind a
# saturated uplink; the module is loaded by
# /usr/lib/modules-load.d/uflinux-fq-codel.conf, because the kernel ships it
# as sch_fq_codel rather than built in.
net.core.default_qdisc = fq_codel
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_rfc1337 = 1

# net.ipv4.tcp_congestion_control is deliberately not set: the UFLinux kernel
# is built with BBRv3 as DEFAULT_TCP_CONG, and overriding it here would
# silently discard that choice.
