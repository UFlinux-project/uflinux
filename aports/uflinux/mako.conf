# UFLinux notification style (Mako). Dark rounded cards matching the panel
# popovers, grouped like GNOME, anchored bottom-right above the 40px panel.
font=Ubuntu Nerd Font 10
max-width=380
background-color=#303030
text-color=#ffffff
border-size=0
border-radius=14
padding=10
margin=12,12,52
anchor=bottom-right
icons=/usr/share/icons/hicolor/24x24/apps:/usr/share/icons/Papirus/24x24/apps
max-icon-size=24
text-wrap=yes
group-by=summary
default-timeout=6000

[urgency=critical]
default-timeout=0
ignore-timeout=yes
