[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=simp1e-cursors-adw-dark
gtk-font-name=Ubuntu Nerd Font 10
gtk-application-prefer-dark-theme=true
# Fallback for apps that draw their own title bar when the
# org.gnome.desktop.wm.preferences schema is unavailable. Without a layout here
# GTK uses its built-in "menu:close", which hides minimize and maximize.
# Note the GTK names (minimize/maximize) differ from labwc's (iconify/max).
gtk-decoration-layout=icon:minimize,maximize,close
