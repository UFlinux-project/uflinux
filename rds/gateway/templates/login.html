<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#181818" />
    <meta name="color-scheme" content="dark" />
    <title>UFlinux Remote Desktop</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body class="login">
    <main class="login-main">
      <form class="panel login-panel" id="login" autocomplete="on" aria-labelledby="login-title">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="wordmark">UFlinux<span class="brand-dot">.</span></span>
        </div>
        <h1 id="login-title">Remote Desktop</h1>
        <label class="field">
          <span>Username</span>
          <input id="username" name="username" autocomplete="username" autocapitalize="none" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="button" id="submit" type="submit">Sign in</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="/assets/login.js"></script>
  </body>
</html>
