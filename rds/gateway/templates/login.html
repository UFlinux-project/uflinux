<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UFLinux RDS — Sign in</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <main>
      <form class="card" id="login" autocomplete="on">
        <p class="label"><b>01 /</b> uflinux rds</p>
        <h1>Sign in</h1>
        <p class="hint">Less noise. More Linux. One session, straight to your desktop.</p>

        <label class="field">
          <span>username</span>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </label>

        <label class="field">
          <span>password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>

        <button id="submit" type="submit">Connect</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>

        <p class="foot">02 / session token is single-use · nothing is stored on the server</p>
      </form>
    </main>
    <script src="/assets/login.js"></script>
  </body>
</html>
