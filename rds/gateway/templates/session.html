<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#191919" />
    <meta name="color-scheme" content="dark" />
    <title>UFLinux RDS — Session</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body class="console">
    <main id="console">
      <header class="bar">
        <h1 class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="wordmark">UFlinux<span class="brand-dot">.</span></span>
        </h1>
        <span class="pill" id="state" data-state="connecting" role="status" aria-live="polite"
          >connecting</span
        >
        <span class="spacer"></span>
        <button class="button secondary compact" id="paste" type="button" title="Send local clipboard text to the desktop">Paste</button>
        <button class="button secondary compact" id="send-break" type="button" title="Send Ctrl+Alt+Del">Ctrl Alt Del</button>
        <button class="button secondary compact" id="fullscreen" type="button" title="Toggle fullscreen">Fullscreen</button>
        <button class="button secondary compact" id="disconnect" type="button" title="Close the session">Disconnect</button>
      </header>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <div class="screen" id="screen-wrap">
        <canvas id="screen" width="1280" height="800" tabindex="0"></canvas>

        <div class="overlay" id="overlay" role="alertdialog" aria-live="assertive" hidden>
          <p class="eyebrow">SESSION CLOSED</p>
          <p class="reason" id="overlay-reason"></p>
          <p>Your token was spent, so coming back means signing in again.</p>
          <div class="actions">
            <button class="button" id="reconnect" type="button">Reconnect</button>
          </div>
        </div>

        <p class="toast" id="toast" aria-hidden="true"></p>
      </div>
    </main>

    <script src="/assets/console.js"></script>
  </body>
</html>
