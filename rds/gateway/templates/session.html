<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UFLinux RDS — Session</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <main>
      <section class="card" id="console">
        <div class="bar">
          <h1><span class="sr">01 /</span> uflinux rds</h1>
          <span class="pill" id="state" data-state="connecting" role="status" aria-live="polite">connecting</span>
          <span class="spacer"></span>
          <button class="ghost" id="paste" type="button" title="Ask the remote side for its clipboard">Paste</button>
          <button class="ghost" id="send-break" type="button" title="Send Ctrl+Alt+Del">Ctrl Alt Del</button>
          <button class="ghost" id="fullscreen" type="button" title="Toggle fullscreen">Fullscreen</button>
          <button class="ghost" id="disconnect" type="button" title="Close the session">Disconnect</button>
        </div>

        <div class="screen" id="screen-wrap">
          <canvas id="screen" width="1280" height="800" tabindex="0"></canvas>
          <div class="overlay" id="overlay" role="alertdialog" aria-live="assertive" hidden>
            <p class="reason" id="overlay-reason"></p>
            <p>The session is closed. Your token was spent, so reconnecting means signing in again.</p>
            <p><button id="reconnect" type="button">Reconnect</button></p>
          </div>
          <p class="toast" id="toast" aria-hidden="true"></p>
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="/assets/console.js"></script>
  </body>
</html>
