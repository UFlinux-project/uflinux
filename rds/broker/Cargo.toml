[package]
name = "uflinux-rds-broker"
description = "Resident UFLinux RDS broker: listeners, fork-per-connection, session roster"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "uflinux-rdsd"
path = "src/main.rs"

[dependencies]
uflinux-rds-common.workspace = true
# `tokio::process` is how the broker reaps session children: a per-session task
# awaiting `child.wait()` beats a SIGCHLD handler, which would race the accept
# loop and reap children the roster knows nothing about. The workspace line
# leaves the feature off because neither the gateway nor the server spawns
# anything, so it is added here; member features are additive, so this does not
# change how any other crate in the workspace is built.
tokio = { workspace = true, features = ["process"] }
nix.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
