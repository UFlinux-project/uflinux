name: Build and release UFLinux

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Build and test all architectures instead of the x86_64 smoke set'
        type: boolean
        default: false
      device_images:
        description: 'Build device disk images (release tags always build them)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      vm: ${{ steps.matrix.outputs.vm }}
      packages: ${{ steps.matrix.outputs.packages }}
      devices: ${{ steps.matrix.outputs.devices }}
      devices_enabled: ${{ steps.matrix.outputs.devices_enabled }}
      version: ${{ steps.matrix.outputs.version }}
      epoch: ${{ steps.matrix.outputs.epoch }}
      cache: ${{ steps.matrix.outputs.cache }}
      release: ${{ steps.matrix.outputs.release }}
      kernel_tag: ${{ steps.kernel.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check.py
      # The kernel release is the newest one at this moment, and every later job
      # is handed that tag. Resolving "latest" per job would let a kernel
      # published mid-run give the ISO and the repository different packages.
      - name: Select the kernel release
        id: kernel
        run: echo "tag=$(python3 scripts/kernel-release.py)" >> "$GITHUB_OUTPUT"
      - name: Check Alpine package availability across all targets
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          UFLINUX_KERNEL_TAG: ${{ steps.kernel.outputs.tag }}
        run: python3 scripts/check-packages.py
      - name: Validate shell and Actions workflows
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
          # -x makes shellcheck honour the `shellcheck source=` directives that
          # point at files installed under /usr, so variables and functions the
          # sourced libraries define (boot_modes, grub_menu, ...) are known.
          shellcheck -x -S warning scripts/*.sh profiles/*.sh tests/*.sh rds/scripts/*.sh settings/scripts/*.sh aports/uflinux/uflinux-session aports/uflinux/uflinux-autostart aports/uflinux/uflinux-compositor aports/uflinux/uflinux-network-init aports/connman/connman-vpn.initd settings/data/uflinux-acpid.initd settings/data/uflinux-power-button
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          "$(go env GOPATH)/bin/actionlint" -config-file .github/actionlint.yaml .github/workflows/build.yml
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FULL: ${{ inputs.full_matrix }}
          DEVICES: ${{ inputs.device_images }}
        run: python3 scripts/ci-matrix.py

  compile:
    needs: checks
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.checks.outputs.packages) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      SOURCE_DATE_EPOCH: ${{ needs.checks.outputs.epoch }}
      APK_REPOSITORY_URL: ${{ vars.APK_REPOSITORY_URL }}
      CARGO_BUILD_JOBS: '${{ matrix.cargo_jobs }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare architecture emulation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user-binfmt binfmt-support
          python3 scripts/preflight.py --arch '${{ matrix.arch }}'
      - name: Install musl profiling tools
        if: matrix.package == 'musl' && (matrix.arch == 'x86_64' || matrix.arch == 'aarch64' || matrix.arch == 'riscv64')
        run: |
          sudo apt-get install --no-install-recommends -y bolt-22 linux-perf
          if [ '${{ matrix.arch }}' = riscv64 ]; then
            sudo apt-get install --no-install-recommends -y qemu-system-riscv opensbi cpio
            qemu-system-riscv64 --version
          fi
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: .cache/build/${{ matrix.package }}
          key: compile-v2-${{ matrix.arch }}-${{ matrix.package }}-${{ (matrix.settings_pgo || matrix.rds_pgo) && 'pgo-' || '' }}${{ needs.checks.outputs.cache }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compile-v2-${{ matrix.arch }}-${{ matrix.package }}-${{ (matrix.settings_pgo || matrix.rds_pgo) && 'pgo-' || '' }}${{ needs.checks.outputs.cache }}-
      - name: Compile without release secrets
        run: |
          args=()
          if [ "${{ matrix.settings_pgo }}" = true ]; then args+=(--settings-pgo); fi
          if [ "${{ matrix.rds_pgo }}" = true ]; then args+=(--rds-pgo); fi
          timeout --signal=INT --kill-after=60s ${{ (matrix.settings_pgo || matrix.rds_pgo) && '210m' || '300m' }} sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,CARGO_BUILD_JOBS,GITHUB_REPOSITORY,GITHUB_SHA bash scripts/build.sh --arch '${{ matrix.arch }}' --version '${{ needs.checks.outputs.version }}' --stage packages --package '${{ matrix.package }}' "${args[@]}"
      - name: Compare a clean native rebuild
        if: matrix.arch == 'x86_64'
        run: |
          timeout --signal=INT --kill-after=60s ${{ (matrix.settings_pgo || matrix.rds_pgo) && '120m' || '40m' }} sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,CARGO_BUILD_JOBS,GITHUB_REPOSITORY,GITHUB_SHA python3 scripts/reproducibility.py --arch x86_64 --version '${{ needs.checks.outputs.version }}' --package '${{ matrix.package }}'
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .cache/build/${{ matrix.package }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-shard-${{ matrix.arch }}-${{ matrix.package }}
          retention-days: 7
          path: out/package-shards/${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  images:
    needs: [checks, compile]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      SOURCE_DATE_EPOCH: ${{ needs.checks.outputs.epoch }}
      APK_REPOSITORY_URL: ${{ vars.APK_REPOSITORY_URL }}
      RELEASE: ${{ needs.checks.outputs.release }}
      UFLINUX_KERNEL_TAG: ${{ needs.checks.outputs.kernel_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-shard-${{ matrix.arch }}-*
          merge-multiple: true
          path: out/package-shards/${{ matrix.arch }}
      - name: Validate complete package set and combine build records
        run: python3 scripts/merge-packages.py --arch '${{ matrix.arch }}' --version '${{ needs.checks.outputs.version }}'
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user-binfmt binfmt-support
          python3 scripts/preflight.py --arch '${{ matrix.arch }}'
      - name: Sign packages and assemble ISO
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ needs.checks.outputs.release == 'true' && secrets.APK_SIGNING_PRIVATE_KEY || '' }}
          APK_SIGNING_PUBLIC_KEY: ${{ needs.checks.outputs.release == 'true' && secrets.APK_SIGNING_PUBLIC_KEY || '' }}
        run: |
          release_args=()
          if [ "$RELEASE" = true ]; then release_args+=(--release); fi
          for stage in sign image; do
            sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,GITHUB_REPOSITORY,GITHUB_SHA,APK_SIGNING_PRIVATE_KEY,APK_SIGNING_PUBLIC_KEY,UFLINUX_KERNEL_TAG,GH_TOKEN bash scripts/build.sh --arch '${{ matrix.arch }}' --version '${{ needs.checks.outputs.version }}' --stage "$stage" "${release_args[@]}"
          done
      - name: Verify signatures, desktop and installer checks
        run: |
          release_args=()
          if [ "$RELEASE" = true ]; then release_args+=(--release); fi
          sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,GITHUB_REPOSITORY,GITHUB_SHA,UFLINUX_KERNEL_TAG,GH_TOKEN bash scripts/build.sh --arch '${{ matrix.arch }}' --version '${{ needs.checks.outputs.version }}' --stage verify "${release_args[@]}"
      - name: Exercise release signing and key cleanup with a disposable key
        if: matrix.arch == 'x86_64'
        run: sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,GITHUB_REPOSITORY,GITHUB_SHA,UFLINUX_KERNEL_TAG,GH_TOKEN python3 tests/signing-smoke.py --arch x86_64 --version '${{ needs.checks.outputs.version }}'
      - name: Upload verification diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.arch }}
          path: out/checks/${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          retention-days: 7
          path: |
            out/images
            out/repository
            out/metadata
            out/checks
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inputs-${{ matrix.arch }}
          retention-days: 7
          path: out/inputs
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  vm:
    needs: [checks, images]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.checks.outputs.vm) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
          path: out
      - name: Install emulators and firmware
        run: |
          sudo apt-get update
          packages=()
          case '${{ matrix.arch }}' in
            x86_64) packages=(qemu-system-x86 ovmf) ;;
            aarch64) packages=(qemu-system-arm qemu-efi-aarch64) ;;
            ppc64le) packages=(qemu-system-ppc) ;;
            riscv64) packages=(qemu-system-riscv opensbi qemu-efi-riscv64) ;;
          esac
          sudo apt-get install --no-install-recommends -y python3-pexpect "${packages[@]}"
      - name: Verify boot through GRUB
        run: |
          arch='${{ matrix.arch }}'
          mode='${{ matrix.mode }}'
          iso="out/images/$arch/uflinux-${{ needs.checks.outputs.version }}-$arch.iso"
          if [ "$arch" = x86_64 ]; then
            network=()
            if [ "$mode" = bios ]; then network+=(--network-tests); fi
            python3 scripts/vm-test.py --arch "$arch" --mode "$mode" --iso "$iso" "${network[@]}"
          else
            python3 scripts/arch-boot-smoke.py --arch "$arch" --iso "$iso"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vm-${{ matrix.arch }}-${{ matrix.mode }}
          retention-days: 7
          path: out/vm
          if-no-files-found: error
          overwrite: true

  device-images:
    needs: [checks, compile]
    # Outside releases and explicit manual requests the devices matrix is empty,
    # and Actions refuses to evaluate a strategy with no vectors at all.
    if: needs.checks.outputs.devices_enabled == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.checks.outputs.devices) }}
    runs-on: ${{ matrix.runner }}
    # Experimental targets are not allowed to fail a release; their logs and any
    # image they do produce are still published by the device-assets job.
    continue-on-error: ${{ matrix.experimental == 'true' }}
    timeout-minutes: 350
    env:
      SOURCE_DATE_EPOCH: ${{ needs.checks.outputs.epoch }}
      APK_REPOSITORY_URL: ${{ vars.APK_REPOSITORY_URL }}
      RELEASE: ${{ needs.checks.outputs.release }}
      UFLINUX_KERNEL_TAG: ${{ needs.checks.outputs.kernel_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-shard-${{ matrix.arch }}-*
          merge-multiple: true
          path: out/package-shards/${{ matrix.arch }}
      - name: Validate complete package set and combine build records
        run: python3 scripts/merge-packages.py --arch '${{ matrix.arch }}' --version '${{ needs.checks.outputs.version }}'
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user-binfmt binfmt-support dosfstools mtools e2fsprogs f2fs-tools xfsprogs zstd
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            sudo apt-get install --no-install-recommends -y grub-pc-bin
          fi
          python3 scripts/preflight.py --arch '${{ matrix.arch }}'
      - name: Sign packages and assemble the device disk image
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ needs.checks.outputs.release == 'true' && secrets.APK_SIGNING_PRIVATE_KEY || '' }}
          APK_SIGNING_PUBLIC_KEY: ${{ needs.checks.outputs.release == 'true' && secrets.APK_SIGNING_PUBLIC_KEY || '' }}
        run: |
          release_args=()
          if [ "$RELEASE" = true ]; then release_args+=(--release); fi
          build_args=(--arch '${{ matrix.arch }}' --version '${{ needs.checks.outputs.version }}')
          sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,GITHUB_REPOSITORY,GITHUB_SHA,APK_SIGNING_PRIVATE_KEY,APK_SIGNING_PUBLIC_KEY,UFLINUX_KERNEL_TAG,GH_TOKEN bash scripts/build.sh "${build_args[@]}" --stage sign "${release_args[@]}"
          sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,GITHUB_REPOSITORY,GITHUB_SHA,APK_SIGNING_PRIVATE_KEY,APK_SIGNING_PUBLIC_KEY,UFLINUX_KERNEL_TAG,GH_TOKEN bash scripts/build.sh "${build_args[@]}" --device '${{ matrix.device }}' --stage device "${release_args[@]}"
      - name: Boot and verify GRUB device images
        if: matrix.device == 'vm' || startsWith(matrix.device, 'pc-')
        run: |
          arch='${{ matrix.arch }}'
          if [ "$arch" = aarch64 ]; then
            sudo apt-get install --no-install-recommends -y qemu-system-arm qemu-efi-aarch64 python3-pexpect
          else
            sudo apt-get install --no-install-recommends -y qemu-system-x86 ovmf python3-pexpect
          fi
          device='${{ matrix.device }}'
          modes=(uefi)
          if [[ "$device" == pc-* ]]; then modes+=(bios); fi
          for mode in "${modes[@]}"; do
            python3 scripts/device-vm-test.py --arch "$arch" --device "$device" --mode "$mode" \
              --image "out/devices/$arch/uflinux-${{ needs.checks.outputs.version }}-$device-$arch.img.zst" \
              --log "out/checks/$arch/device-$device-$mode-boot.log"
          done
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-diagnostics-${{ matrix.device }}-${{ matrix.arch }}
          path: out/checks/${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-images-${{ matrix.device }}-${{ matrix.arch }}
          retention-days: 7
          path: |
            out/devices
            out/metadata
            out/checks
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  draft:
    if: needs.checks.outputs.release == 'true'
    needs: [checks, images, vm]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/release.py create --version "$VERSION"
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          GH_TOKEN: ${{ github.token }}

  publish:
    if: needs.checks.outputs.release == 'true'
    needs: [checks, images, vm, draft]
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.checks.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.checks.outputs.epoch }}
      APK_REPOSITORY_URL: ${{ vars.APK_REPOSITORY_URL }}
      UFLINUX_KERNEL_TAG: ${{ needs.checks.outputs.kernel_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vm-*
          merge-multiple: true
          path: out/vm
      - run: python3 scripts/fetch-previous.py
      - name: Build complete signed APK repository
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
          APK_SIGNING_PUBLIC_KEY: ${{ secrets.APK_SIGNING_PUBLIC_KEY }}
        run: |
          previous=()
          if [ -d out/previous/repository ]; then previous+=(--previous out/previous/repository); fi
          sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,GITHUB_REPOSITORY,APK_SIGNING_PRIVATE_KEY,APK_SIGNING_PUBLIC_KEY,UFLINUX_KERNEL_TAG,GH_TOKEN python3 scripts/publish-repository.py --version "$VERSION" "${previous[@]}"
      - name: Check fresh clients and retained-version upgrades through the Pages layout
        run: |
          sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,GITHUB_REPOSITORY,UFLINUX_KERNEL_TAG,GH_TOKEN python3 scripts/verify-repository.py --version "$VERSION" --staging out/pages/apk/v3.24/uflinux
          sudo --preserve-env=SOURCE_DATE_EPOCH python3 scripts/release-records.py --version "$VERSION"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/images/*/*.iso
            out/SHA256SUMS
      - run: python3 scripts/release.py prepare --version "$VERSION"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/pages
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      - name: Check the deployed signed repository before publishing the release
        run: |
          for attempt in 1 2 3; do
            if sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,GITHUB_REPOSITORY,UFLINUX_KERNEL_TAG,GH_TOKEN python3 scripts/verify-repository.py --version "$VERSION"; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: published-repository-check
          path: out/checks/x86_64/repository-published.json
          if-no-files-found: ignore
          retention-days: 30
      - run: python3 scripts/release.py publish --version "$VERSION"

  device-assets:
    needs: [checks, publish, device-images]
    if: always() && needs.publish.result == 'success'
    # Device images are supplementary: they attach to the published release, but a
    # missing or failed image never stops the ISOs and repository from being published.
    continue-on-error: true
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: device-images-*
          merge-multiple: true
          path: out
      - name: Upload device images to the release
        run: |
          shopt -s nullglob
          assets=(out/devices/*/*.img.zst out/devices/*/*.img.zst.sha256)
          if [ ${#assets[@]} -eq 0 ]; then echo "No device images were built" >&2; exit 1; fi
          gh release upload "v$VERSION" --clobber "${assets[@]}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/devices/*/*.img.zst

